name: Code quality – RubyCritic

# Scoped so a commit is checked once, not twice. A bare `push:` alongside
# `pull_request:` means every push to a branch with an open PR fires both
# events, and the same commit gets two identical runs. Limiting `push` to the
# default branch leaves pull requests to the `pull_request` event and merges to
# the `push` one.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  rubycritic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install RubyCritic
        run: gem install rubycritic

      # lib/ scores 89.98 as of the Timetable extraction and the HttpClient
      # merge. The gate sits about two points under that on purpose: tight
      # enough to catch real decay, loose enough that an ordinary addition does
      # not turn CI red and train the next person to lower the number.
      - name: Run RubyCritic
        run: rubycritic --minimum-score 91 --format console --no-browser lib
