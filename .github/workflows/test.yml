name: Tests

# Scoped so a commit is checked once, not twice. A bare `push:` alongside
# `pull_request:` means every push to a branch with an open PR fires both
# events, and the same commit gets two identical runs. Limiting `push` to the
# default branch leaves pull requests to the `pull_request` event and merges to
# the `push` one.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run tests
        run: ruby test.rb
