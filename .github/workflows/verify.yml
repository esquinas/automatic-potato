name: Verify unknowns

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Run verification script
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ruby bin/verify.rb
