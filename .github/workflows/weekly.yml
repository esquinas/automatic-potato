name: Weekly VO Cinema Notifier

# Fires Wednesday and Friday at 11:00 UTC — noon in Gijón while CET is in
# force, 13:00 while CEST is, since Gijón moves between the two and this
# is a single fixed UTC hour rather than a pair of them. Either way it is
# well before the first screenings of the day (the earliest seen at Ocimax
# is 16:00), so day zero still reaches subscribers whole. The hour of drift
# across the daylight-saving switch is not worth a guard: GitHub's own
# best-effort scheduling can already land a run hours later than requested
# (see the programme-watch readings), so a fixed local hour was never on
# offer anyway.
#
# Wednesday rather than Monday because the cinemas publish a base
# programme and fill in the rest of the week later, mid-week — a Monday
# run undercounts the coming weekend. See "Does the programme fill in
# mid-week?" in CLAUDE.md.

on:
  schedule:
    - cron: '0 11 * * 3,5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending: print the digest and the agreement block"
        type: boolean
        default: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Send notification
        if: inputs.dry_run != true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ruby bin/run.rb

      # Deliberately given no Telegram secrets: a dry run then *cannot* post,
      # which is a property of the step rather than a promise about the code.
      # This is how to read the agreement block without costing subscribers a
      # duplicate digest.
      - name: Preview the run without sending
        if: inputs.dry_run == true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ruby bin/preview.rb
